name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Conformité du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed .

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

  build:
    name: Compilation APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::Le secret $v est vide ou introuvable"
              exit 
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > android/app/flexify-key.jks
          test -s android/app/flexify-key.jks || { echo "::error::Le fichier .jks est vide"; exit 1; }
          echo "Taille du .jks : $(stat -c %s android/app/flexify-key.jks) octets"
          keytool -list -keystore android/app/flexify-key.jks -storepass "$KEYSTORE_PASSWORD" \
            | grep -iE "Keystore type|Your keystore contains|fingerprint" \
            || { echo "::error::Keystore illisible : KEYSTORE_BASE64 incomplet, ou mauvais mot de passe"; exit 1; }
          cat > android/key.properties <<EOF
          storeFile=flexify-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: APK debug
        if: github.ref != 'refs/heads/main'
        run: flutter build apk --debug

      - name: APK release
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release

      - name: Uploader l'APK debug
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: flexify-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Uploader l'APK release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: flexify-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
