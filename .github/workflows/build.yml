name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  translate:
    name: Traduction des .arb
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clés manquantes ?
        id: check
        run: |
          set +e
          python3 scripts/translate_arb.py --check
          code=$?
          if [ "$code" -eq 10 ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Cache des modèles de traduction
        if: steps.check.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-models-${{ hashFiles('scripts/translate_arb.py') }}

      - name: Installer Argos Translate
        if: steps.check.outputs.needed == 'true'
        run: pip install argostranslate

      - name: Traduire les clés manquantes
        if: steps.check.outputs.needed == 'true'
        run: python3 scripts/translate_arb.py

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.needed == 'true'
        with:
          channel: stable
          cache: true

      - name: Régénérer et formater les traductions
        if: steps.check.outputs.needed == 'true'
        run: |
          flutter pub get
          dart format lib/l10n

      - name: Commit
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/l10n
          git diff --cached --quiet || git commit -m "chore: translate missing l10n keys"
          git push

  quality:
    name: Conformité du code
    needs: translate
    if: ${{ !cancelled() && (needs.translate.result == 'success' || needs.translate.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name != 'pull_request' && github.ref_name) || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref) || '' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Formatage
        run: dart format .

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

  build:
    name: Compilation APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name != 'pull_request' && github.ref_name) || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref) || '' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::Le secret $v est vide ou introuvable"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > android/app/flexify-key.jks
          test -s android/app/flexify-key.jks || { echo "::error::Le fichier .jks est vide"; exit 1; }
          echo "Taille du .jks : $(stat -c %s android/app/flexify-key.jks) octets"
          keytool -list -keystore android/app/flexify-key.jks -storepass "$KEYSTORE_PASSWORD" \
            | grep -iE "Keystore type|Your keystore contains|fingerprint" \
            || { echo "::error::Keystore illisible : KEYSTORE_BASE64 incomplet, ou mauvais mot de passe"; exit 1; }
          cat > android/key.properties <<EOF
          storeFile=flexify-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: APK debug
        if: github.ref != 'refs/heads/main'
        run: flutter build apk --debug

      - name: APK release
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release

      - name: Uploader l'APK debug
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: flexify-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Uploader l'APK release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: flexify-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk